# Local development: docker compose up
# Web: http://localhost:5173   API: http://localhost:4000/api/v1/health   DB: localhost:5432
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm
      JWT_SECRET: local-dev-secret-change-me-please
      CORS_ORIGIN: http://localhost:5173
      PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  pgdata:
