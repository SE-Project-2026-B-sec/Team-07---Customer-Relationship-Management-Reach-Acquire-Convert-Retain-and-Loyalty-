# CRM-3: after CI passes on main, deploys the API to Render and the web app to Vercel,
# then smoke-tests both.
# Repo secrets for the API: RENDER_DEPLOY_HOOK, RENDER_API_KEY, RENDER_SERVICE_ID, API_BASE_URL
#   (API_BASE_URL should be e.g. https://your-app.onrender.com/api/v1)
# Repo secrets for the web app: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   (deploy-web is skipped with a warning until all three are added)
# Optional repo variable: WEB_URL (production web address used by the web smoke test)
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      # -------------------------------------------------
      # 0️⃣ Verify required secrets (Bash parameter expansion)
      # -------------------------------------------------
      - name: Verify required secrets
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Missing RENDER_API_KEY secret}"
          : "${SERVICE_ID:?Missing RENDER_SERVICE_ID secret}"
          : "${RENDER_DEPLOY_HOOK:?Missing RENDER_DEPLOY_HOOK secret}"
          : "${API_BASE_URL:?Missing API_BASE_URL secret}"

      # -------------------------------------------------
      # 1️⃣ Capture the most recent *live* deployment (for rollback)
      # -------------------------------------------------
      - name: Remember the currently live deploy (for rollback)
        id: previous
        run: |
          set -euo pipefail
          # Fetch up to 100 recent deploys and select the first whose status is "live"
          PREV=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=100" |
            jq -r '[.[] | select(.deploy.status == "live")] | first | .deploy.id // empty')
          if [ -z "$PREV" ]; then
            echo "No previous live deployment found" >&2
            exit 1
          fi
          echo "id=$PREV" >> "$GITHUB_OUTPUT"
          echo "Currently live deploy ID: $PREV"

      # -------------------------------------------------
      # 2️⃣ Trigger a new Render deployment (webhook)
      # -------------------------------------------------
      - name: Trigger Render deploy
        id: trigger
        run: |
          set -euo pipefail
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      # -------------------------------------------------
      # 3️⃣ Wait for the new deployment to become live **and** have a new ID
      # -------------------------------------------------
      - name: Wait for the new deploy to finish
        id: wait
        run: |
          set -euo pipefail
          sleep 20
          PREV_ID="${{ steps.previous.outputs.id }}"
          for i in $(seq 1 60); do
            # Attempt to fetch the latest deploy info; tolerate temporary errors
            set +e
            RESP=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=1")
            CURL_EXIT=$?
            set -e
            if [ $CURL_EXIT -ne 0 ] || [ -z "$RESP" ]; then
              echo "Temporary error fetching deploy status (exit $CURL_EXIT), will retry"
            else
              CUR_ID=$(echo "$RESP" | jq -r '.[0].deploy.id')
              CUR_STATUS=$(echo "$RESP" | jq -r '.[0].deploy.status')
              echo "Latest deploy ID: $CUR_ID, status: $CUR_STATUS"
              if [ "$CUR_ID" != "$PREV_ID" ] && [ "$CUR_STATUS" = "live" ]; then
                echo "New deployment is live"
                exit 0
              fi
              case "$CUR_STATUS" in
                build_failed|update_failed|canceled|pre_deploy_failed) exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "Timed out waiting for new live deployment" && exit 1

      # -------------------------------------------------
      # 4️⃣ Smoke‑test the health endpoint (must return HTTP 200 and {"status":"ok"})
      # -------------------------------------------------
      - name: Smoke test GET /api/v1/health
        id: smoke
        run: |
          set -euo pipefail
          # API_BASE_URL already ends with /api/v1
          for i in $(seq 1 10); do
            if RESPONSE=$(curl -fsS "${API_BASE_URL}/health"); then
              if echo "$RESPONSE" | jq -e '.status == "ok"' > /dev/null; then
                echo "API is healthy"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Health check failed" && exit 1

      # -------------------------------------------------
      # 5️⃣ Roll back if the new deployment failed *or* the smoke test failed
      # -------------------------------------------------
      - name: Roll back to the previous deploy (if needed)
        if: |
          failure() &&
          steps.trigger.outcome == 'success' &&
          steps.previous.outputs.id != '' &&
          (steps.wait.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\":\"${{ steps.previous.outputs.id }}\"}" \
            "https://api.render.com/v1/services/$SERVICE_ID/rollback"
          echo "Rolled back to ${{ steps.previous.outputs.id }}"

  # ---------------------------------------------------------------------------
  # Web app -> Vercel. Deploying from CI with the Vercel CLI means a merge by any
  # teammate reaches production (Vercel's Hobby Git integration only deploys
  # commits made by the Vercel project owner).
  # ---------------------------------------------------------------------------
  deploy-web:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      WEB_URL: ${{ vars.WEB_URL || 'https://team-07-customer-relationship-manag.vercel.app' }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Web deploy skipped: add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repo secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Deploy exactly the commit that passed CI.
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install the Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@65.14.0

      # Pulls the project's settings (root directory, build command) and its
      # production environment variables, e.g. VITE_API_URL.
      - name: Pull Vercel project settings
        if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"

      # The production address must serve the CRM app (page title CRM-RACRL).
      - name: Smoke test the web app
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # /login also proves apps/web/vercel.json sends app routes to index.html.
          for _ in $(seq 1 10); do
            if curl -fsS "$WEB_URL/login" | grep -q '<title>CRM-RACRL</title>'; then
              echo "Web app is live at $WEB_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$WEB_URL did not serve the CRM app" && exit 1
