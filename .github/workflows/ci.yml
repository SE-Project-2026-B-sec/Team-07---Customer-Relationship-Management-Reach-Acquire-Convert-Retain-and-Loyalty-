# CRM-2: runs on every push and pull request.
# Branch protection on main should require the "ci-pass" check.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test-api:
    name: API tests (with PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      JWT_SECRET: ci-only-secret-at-least-16-chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create tables
        run: npx prisma migrate deploy
        working-directory: apps/api
      - name: Load demo data
        run: npm run seed --workspace apps/api
      - name: Run tests (fails if line coverage < 70%)
        run: npm run test:coverage --workspace apps/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage

  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test --workspace apps/web

  build:
    name: Build web, API and Docker image
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build API Docker image (not pushed)
        run: docker build -f apps/api/Dockerfile -t crm-api:ci .
      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=high || true

  # CRM-16: uncomment this job (and add "e2e" to ci-pass below) once e2e/ tests exist.
  # e2e:
  #   name: End-to-end tests
  #   runs-on: ubuntu-latest
  #   needs: build
  #   services:
  #     postgres:
  #       image: postgres:16
  #       env:
  #         POSTGRES_USER: crm
  #         POSTGRES_PASSWORD: crm
  #         POSTGRES_DB: crm
  #       ports: ['5432:5432']
  #       options: >-
  #         --health-cmd "pg_isready -U crm"
  #         --health-interval 5s --health-timeout 5s --health-retries 10
  #   env:
  #     DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
  #     JWT_SECRET: ci-only-secret-at-least-16-chars
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm
  #     - run: npm ci
  #     - run: npx prisma migrate deploy
  #       working-directory: apps/api
  #     - run: npm run seed --workspace apps/api
  #     - run: npx playwright install --with-deps chromium
  #     - run: npx playwright test --retries=2
  #     - if: failure()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: playwright-report
  #         path: playwright-report

  ci-pass:
    name: ci-pass
    runs-on: ubuntu-latest
    needs: [lint, test-api, test-web, build]
    if: always()
    steps:
      - name: All required jobs passed
        run: |
          [[ "${{ needs.lint.result }}" == "success" ]] &&
          [[ "${{ needs.test-api.result }}" == "success" ]] &&
          [[ "${{ needs.test-web.result }}" == "success" ]] &&
          [[ "${{ needs.build.result }}" == "success" ]]
